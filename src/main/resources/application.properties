spring.application.name=auth-gateway
server.port=8000
spring.devtools.add-properties=false
debug=false
logging.pattern.console=%clr(%d{yyyy-MM-dd'T'HH:mm:ss}){faint} %clr(%-5level) %clr(%logger{36}){cyan} : %msg%n

# 1. Kill the startup noise
# spring.main.banner-mode=off
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.apache=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.springframework.beans.factory.support.DisposableBeanAdapter=ERROR

# 2. Keep YOUR app's logs visible
logging.level.com.fahim1837=INFO

# 3. Keep request logging simple: one app-owned line per request
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN
logging.level.com.fahim1837.auth_gateway.RequestLoggingFilter=INFO

auth.jwt.secret=change-this-dev-secret-change-this-dev-secret
auth.jwt.access-token-minutes=15
auth.jwt.refresh-token-days=7

# OAuth2 login routes after credentials are configured:
# GET /oauth2/authorization/google
# GET /oauth2/authorization/github
# GET /oauth2/authorization/facebook
#
# Google:
# spring.security.oauth2.client.registration.google.client-id=your-google-client-id
# spring.security.oauth2.client.registration.google.client-secret=your-google-client-secret
# spring.security.oauth2.client.registration.google.scope=openid,email,profile
#
# GitHub:
# spring.security.oauth2.client.registration.github.client-id=your-github-client-id
# spring.security.oauth2.client.registration.github.client-secret=your-github-client-secret
# spring.security.oauth2.client.registration.github.scope=read:user,user:email
#
# Facebook:
# spring.security.oauth2.client.registration.facebook.client-id=your-facebook-client-id
# spring.security.oauth2.client.registration.facebook.client-secret=your-facebook-client-secret
# spring.security.oauth2.client.registration.facebook.scope=email,public_profile

spring.datasource.url=jdbc:postgresql://localhost:5432/authgateway_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=12341234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
